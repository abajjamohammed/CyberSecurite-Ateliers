<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniSocial • Protocole Décentralisé</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.2/dist/web3.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 15px;
        }
        .app-container {
            max-width: 650px;
            margin: 0 auto;
        }
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        h1 { font-size: 20px; margin: 0; font-weight: 700; color: #fff; }
        .network-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-weight: 600;
        }
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-action:hover { background: var(--primary-hover); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .account-badge {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-top: 10px;
            display: inline-block;
        }
        .contract-field {
            margin-top: 16px;
        }
        .contract-field label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .contract-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .contract-input:focus { border-color: var(--primary); }
        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .post-box {
            background: #0f172a;
            border-left: 3px solid var(--primary);
            border-radius: 0 8px 8px 0;
            padding: 14px 16px;
            margin-bottom: 12px;
            border-top: 1px solid rgba(255,255,255,0.03);
        }
        .post-author {
            font-size: 12px;
            font-family: monospace;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .post-content {
            font-size: 15px;
            line-height: 1.4;
            color: #f1f5f9;
        }
        .status-log {
            font-size: 13px;
            color: var(--success);
            margin-top: 10px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="panel">
        <header>
            <div>
                <h1>MiniSocial Protocol</h1>
                <span style="font-size: 12px; color: var(--text-muted);">Registre social immuable sur Ethereum</span>
            </div>
            <span class="network-badge">Sepolia Testnet</span>
        </header>

        <button id="btnConnect" class="btn-action" onclick="connectWallet()">Connecter le Wallet</button>
        <div id="accountInfo" style="display:none;">
            <div class="account-badge" id="accountAddress">0x...</div>
        </div>
        <div class="contract-field">
            <label for="contractAddress">Adresse du contrat (Sepolia)</label>
            <input id="contractAddress" class="contract-input" type="text" placeholder="0x..." autocomplete="off">
            <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                <button class="btn-action" onclick="configureContract()">Charger le contrat</button>
            </div>
        </div>
        <div id="statusMessage" class="status-log"></div>
    </div>

    <div class="panel">
        <h2 style="font-size: 16px; margin-bottom: 12px;">Émettre une nouvelle publication</h2>
        <textarea id="postInput" rows="3" placeholder="Partagez un message sur la blockchain..."></textarea>
        <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
            <button id="btnPublish" class="btn-action" onclick="publishPost()">Diffuser sur la Blockchain</button>
        </div>
    </div>

    <div class="panel">
        <div class="feed-header">
            <h2 style="font-size: 16px; margin: 0;">Fil d'actualité On-Chain (<span id="postCount">0</span>)</h2>
            <button class="btn-action" onclick="loadPosts()" style="padding: 6px 12px; font-size: 12px;">Actualiser</button>
        </div>
        <div id="postsFeed">
            <p style="color: var(--text-muted); font-size: 13px;">Connectez votre compte pour explorer les publications.</p>
        </div>
    </div>
</div>

<script>
    const CONTRACT_ABI = [
        { "inputs": [{"name": "_message", "type": "string"}], "name": "publishPost", "outputs": [], "stateMutability": "nonpayable", "type": "function" },
        { "inputs": [{"name": "index", "type": "uint256"}], "name": "getPost", "outputs": [{"name": "", "type": "string"}, {"name": "", "type": "address"}], "stateMutability": "view", "type": "function" },
        { "inputs": [], "name": "getTotalPosts", "outputs": [{"name": "", "type": "uint256"}], "stateMutability": "view", "type": "function" }
    ];

    let web3;
    let contract;
    let userAccount = null;

    async function connectWallet() {
        if (!window.ethereum) return alert("MetaMask est requis !");
        web3 = new Web3(window.ethereum);

        try {
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            if (!accounts.length) throw new Error("Aucun compte disponible dans MetaMask.");

            userAccount = accounts[0];
            document.getElementById("btnConnect").style.display = "none";
            document.getElementById("accountInfo").style.display = "block";
            document.getElementById("accountAddress").innerText = `Compte actif : ${userAccount}`;

            if (document.getElementById("contractAddress").value.trim()) {
                configureContract();
            } else {
                contract = null;
                document.getElementById("statusMessage").innerText =
                    "Wallet connecté. Saisissez l'adresse du contrat Sepolia puis cliquez sur Charger le contrat.";
            }
        } catch (err) {
            document.getElementById("statusMessage").innerText = "Échec de connexion du wallet : " + err.message;
        }
    }

    function configureContract() {
        if (!web3) return alert("Connectez d'abord votre wallet.");

        const address = document.getElementById("contractAddress").value.trim();
        if (!web3.utils.isAddress(address)) {
            contract = null;
            document.getElementById("statusMessage").innerText =
                "Adresse de contrat invalide. Vérifiez l'adresse déployée sur Sepolia.";
            return;
        }

        try {
            contract = new web3.eth.Contract(CONTRACT_ABI, address);
            document.getElementById("statusMessage").innerText = "Prêt à interagir avec le smart contract.";
            loadPosts();
        } catch (err) {
            contract = null;
            document.getElementById("statusMessage").innerText = "Impossible de charger le contrat : " + err.message;
        }
    }

    async function publishPost() {
        const text = document.getElementById("postInput").value.trim();
        if (!text) return alert("Le texte ne peut pas être vide.");
        if (!userAccount) return alert("Veuillez connecter votre compte d'abord.");
        if (!contract) return alert("Configurez une adresse de contrat valide avant de publier.");

        const btn = document.getElementById("btnPublish");
        btn.disabled = true;
        document.getElementById("statusMessage").innerText = "Envoi de la transaction... En attente de signature.";

        try {
            await contract.methods.publishPost(text).send({ from: userAccount });
            document.getElementById("postInput").value = "";
            document.getElementById("statusMessage").innerText = "Publication validée et inscrite dans le bloc !";
            loadPosts();
        } catch (err) {
            document.getElementById("statusMessage").innerText = "Transaction annulée.";
        } finally {
            btn.disabled = false;
        }
    }

    async function loadPosts() {
        if (!contract) return;
        const feed = document.getElementById("postsFeed");

        try {
            const count = await contract.methods.getTotalPosts().call();
            document.getElementById("postCount").innerText = count;

            if (count == 0) {
                feed.innerHTML = "<p style='color: var(--text-muted); font-size: 13px;'>Aucun message trouvé sur la blockchain.</p>";
                return;
            }

            feed.innerHTML = "";
            for (let i = count - 1; i >= 0; i--) {
                const item = await contract.methods.getPost(i).call();
                feed.innerHTML += `
                    <div class="post-box">
                        <div class="post-author">Émetteur : ${item[1]} • (Post #${i})</div>
                        <div class="post-content">${escape(item[0])}</div>
                    </div>
                `;
            }
        } catch (e) {
            feed.innerHTML = "<p style='color: #ef4444; font-size: 13px;'>Erreur lors de la lecture des événements.</p>";
        }
    }

    function escape(s) {
        return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    if (window.ethereum) {
        window.ethereum.on('accountsChanged', accs => {
            if (accs.length) { userAccount = accs[0]; document.getElementById("accountAddress").innerText = `Compte actif : ${userAccount}`; loadPosts(); }
            else location.reload();
        });
    }
</script>

</body>
</html>
